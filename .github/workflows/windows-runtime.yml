name: Windows runtime

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: '4.6.3'
      GODOT_WINDOWS_SHA256: e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90
      GODOT_TEMPLATES_SHA256: 3fbe2c0e2dec9d537ab9ec97bcf8da91dcf23357fc51f67092dd068d839290a8
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify Godot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION-stable"
          $editorZip = Join-Path $env:RUNNER_TEMP 'godot-windows.zip'
          $templates = Join-Path $env:RUNNER_TEMP 'godot-templates.tpz'
          Invoke-WebRequest "$release/Godot_v$env:GODOT_VERSION-stable_win64.exe.zip" -OutFile $editorZip
          Invoke-WebRequest "$release/Godot_v$env:GODOT_VERSION-stable_export_templates.tpz" -OutFile $templates
          $editorHash = (Get-FileHash $editorZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $templateHash = (Get-FileHash $templates -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($editorHash -ne $env:GODOT_WINDOWS_SHA256) { throw "Godot editor hash mismatch: $editorHash" }
          if ($templateHash -ne $env:GODOT_TEMPLATES_SHA256) { throw "Godot templates hash mismatch: $templateHash" }
          $editorRoot = Join-Path $env:RUNNER_TEMP 'godot-windows'
          Expand-Archive $editorZip -DestinationPath $editorRoot
          $templateZip = Join-Path $env:RUNNER_TEMP 'godot-templates.zip'
          Copy-Item $templates $templateZip
          $templateStaging = Join-Path $env:RUNNER_TEMP 'godot-template-staging'
          Expand-Archive $templateZip -DestinationPath $templateStaging
          $templatePayload = if (Test-Path (Join-Path $templateStaging 'templates')) {
            Join-Path $templateStaging 'templates'
          } else {
            $templateStaging
          }
          $templateRoot = Join-Path $env:APPDATA "Godot\export_templates\$env:GODOT_VERSION.stable"
          New-Item -ItemType Directory -Path $templateRoot -Force | Out-Null
          Copy-Item (Join-Path $templatePayload '*') $templateRoot -Recurse -Force
          "GODOT_EDITOR=$editorRoot\Godot_v$env:GODOT_VERSION-stable_win64.exe" | Out-File $env:GITHUB_ENV -Append
          "GODOT_CONSOLE=$editorRoot\Godot_v$env:GODOT_VERSION-stable_win64_console.exe" | Out-File $env:GITHUB_ENV -Append

      - name: Build and smoke-test portable runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          ./scripts/Build-OpenDAORuntime.ps1 `
            -GodotRuntime $env:GODOT_EDITOR `
            -GodotConsole $env:GODOT_CONSOLE `
            -OutputRoot "$PWD\artifacts\runtime" `
            -Version $shortSha
          $package = Resolve-Path "$PWD\artifacts\runtime\OpenDAO-$shortSha-windows-x64"
          $oldSmoke = $env:OPENDAO_SMOKE_EXIT
          try {
            $env:OPENDAO_SMOKE_EXIT = '1'
            $process = Start-Process "$package\OpenDAO.exe" -ArgumentList '--headless' -WorkingDirectory $package -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Native OpenDAO launcher smoke test failed: $($process.ExitCode)" }
          }
          finally {
            if ($null -eq $oldSmoke) { Remove-Item Env:OPENDAO_SMOKE_EXIT -ErrorAction SilentlyContinue }
            else { $env:OPENDAO_SMOKE_EXIT = $oldSmoke }
          }
          'OPENDAO_WINDOWS_RUNTIME_GREEN' | Set-Content "$PWD\artifacts\runtime-smoke.txt" -Encoding ascii
          Compress-Archive -Path "$package\*" -DestinationPath "$PWD\artifacts\OpenDAO-windows-x64.zip" -CompressionLevel Optimal
          $zipHash = (Get-FileHash "$PWD\artifacts\OpenDAO-windows-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  OpenDAO-windows-x64.zip" | Set-Content "$PWD\artifacts\OpenDAO-windows-x64.zip.sha256" -Encoding ascii

      - name: Upload green Windows package
        uses: actions/upload-artifact@v4
        with:
          name: OpenDAO-windows-x64-${{ github.sha }}
          path: |
            artifacts/OpenDAO-windows-x64.zip
            artifacts/OpenDAO-windows-x64.zip.sha256
            artifacts/runtime-smoke.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            artifacts/OpenDAO-windows-x64.zip `
            artifacts/OpenDAO-windows-x64.zip.sha256 `
            artifacts/runtime-smoke.txt `
            --repo $env:GITHUB_REPOSITORY `
            --title "OpenDAO $env:GITHUB_REF_NAME" `
            --prerelease `
            --generate-notes
