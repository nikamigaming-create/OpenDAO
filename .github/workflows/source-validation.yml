name: Source validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate scripts and reproducible Haven patch
        shell: pwsh
        run: ./scripts/Test-OpenDAOSource.ps1 -ValidateHavenPatch
